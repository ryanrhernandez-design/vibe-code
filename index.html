<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1e28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fruit Labeling Hero</title>
<style>
  :root {
    --steel: #3b4252;
    --steel-dark: #2b3140;
    --accent: #ffd166;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #1a1e28;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #eee;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 8px;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  #game {
    background: #222836;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    width: 100%;
    max-width: min(100%, calc((100dvh - 130px) * 16 / 9));
    aspect-ratio: 16 / 9;
  }
  #controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 560px;
  }
  .label-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    min-width: 86px;
    padding: 8px 12px;
    border: 2px solid #555e72;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--steel), var(--steel-dark));
    color: #eee;
    font: inherit;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .05s, border-color .1s;
  }
  .label-btn:active, .label-btn.flash {
    transform: translateY(2px) scale(.97);
    border-color: var(--accent);
  }
  .label-btn .fruit { font-size: 24px; line-height: 1.1; }
  @media (max-width: 640px) {
    #controls { gap: 8px; flex-wrap: nowrap; }
    .label-btn { flex: 1; min-width: 0; padding: 12px 4px; }
    .label-btn .fruit { font-size: 30px; }
    .label-btn .key { font-size: 9px; }
  }
  .label-btn .plu {
    background: #fffbe8;
    color: #333;
    font-size: 12px;
    font-weight: 700;
    padding: 0 8px;
    border-radius: 8px;
    border: 1px solid #ccb;
  }
  .label-btn .key { font-size: 10px; color: #9aa3b5; letter-spacing: .5px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="controls"></div>
</div>

<script>
"use strict";

// ---------- Setup ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

// Text boost so HUD/messages stay readable when the canvas is shrunk on phones
let uiBoost = 1;
function updateUiBoost() {
  const cw = canvas.clientWidth || W;
  uiBoost = Math.min(1.6, Math.max(1, 620 / cw));
}

const BELT_Y = 392;          // top surface of the belt
const LABELER_X = W / 2;     // x position of the labeling head
const HEAD_W = 64;

const FRUIT_TYPES = [
  { id: "avocado", name: "Avocado", plu: "4046", emoji: "\u{1F951}", key: "1", unlockLevel: 1 },
  { id: "apple",   name: "Apple",   plu: "4131", emoji: "\u{1F34E}", key: "2", unlockLevel: 1 },
  { id: "citrus",  name: "Orange",  plu: "4012", emoji: "\u{1F34A}", key: "3", unlockLevel: 2 },
  { id: "stone",   name: "Peach",   plu: "4044", emoji: "\u{1F351}", key: "4", unlockLevel: 3 },
];

// ---------- Audio ----------
let audioCtx = null;
function beep(freq, dur, type = "sine", vol = 0.15, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  stamp:   () => { beep(120, 0.08, "square", 0.2); },
  correct: () => { beep(660, 0.08, "sine", 0.12); beep(880, 0.12, "sine", 0.12, 0.07); },
  perfect: () => { beep(660, 0.07, "sine", 0.12); beep(880, 0.07, "sine", 0.12, 0.06); beep(1320, 0.14, "sine", 0.12, 0.12); },
  wrong:   () => { beep(160, 0.3, "sawtooth", 0.18); },
  whiff:   () => { beep(300, 0.06, "triangle", 0.08); },
  miss:    () => { beep(220, 0.15, "square", 0.12); beep(150, 0.25, "square", 0.12, 0.12); },
  levelup: () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, "sine", 0.12, i * 0.09)); },
  gameover:() => { [392, 330, 262, 196].forEach((f, i) => beep(f, 0.25, "triangle", 0.15, i * 0.2)); },
};

// ---------- Game state ----------
const game = {
  state: "menu",            // menu | playing | paused | gameover
  fruits: [],
  texts: [],
  particles: [],
  score: 0,
  best: Number(localStorage.getItem("flh-best") || 0),
  lives: 3,
  level: 1,
  labeled: 0,               // correct labels this run
  combo: 0,
  beltSpeed: 110,           // px per second
  spawnTimer: 1,
  headAnim: 0,              // 0..1 piston extension
  headLabel: null,          // fruit type id shown on the piston
  shake: 0,
  time: 0,
};

function reset() {
  game.fruits = [];
  game.texts = [];
  game.particles = [];
  game.score = 0;
  game.lives = 3;
  game.level = 1;
  game.labeled = 0;
  game.combo = 0;
  game.beltSpeed = 110;
  game.spawnTimer = 1.2;
  game.headAnim = 0;
  game.shake = 0;
}

function availableTypes() {
  return FRUIT_TYPES.filter(f => f.unlockLevel <= game.level);
}

function spawnFruit() {
  const types = availableTypes();
  const type = types[Math.floor(Math.random() * types.length)];
  game.fruits.push({
    type: type.id,
    x: -50,
    r: 26 + Math.random() * 5,
    labeled: false,
    labelPlu: null,
    wrong: false,
    rot: Math.random() * Math.PI * 2,
    bobSeed: Math.random() * 10,
  });
}

function addText(x, y, str, color, size = 20) {
  game.texts.push({ x, y, str, color, size, life: 1 });
}

function addBurst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 140;
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.6, color });
  }
}

function loseLife(reason, x, y) {
  game.lives--;
  game.combo = 0;
  game.shake = 8;
  addText(x, y, reason, "#ff6b6b", 22);
  if (game.lives <= 0) {
    game.state = "gameover";
    if (game.score > game.best) {
      game.best = game.score;
      localStorage.setItem("flh-best", String(game.best));
    }
    sfx.gameover();
  }
}

// ---------- Input: fire a label ----------
function fireLabel(typeId) {
  if (game.state === "menu" || game.state === "gameover") { startGame(); return; }
  if (game.state !== "playing") return;

  const type = FRUIT_TYPES.find(f => f.id === typeId);
  game.headAnim = 1;
  game.headLabel = typeId;
  sfx.stamp();
  flashButton(typeId);

  // Nearest unlabeled fruit under the head
  let target = null, bestDist = Infinity;
  for (const fr of game.fruits) {
    const d = Math.abs(fr.x - LABELER_X);
    if (!fr.labeled && d <= fr.r + 10 && d < bestDist) { bestDist = d; target = fr; }
  }

  if (!target) {
    addText(LABELER_X, BELT_Y - 90, "WASTED LABEL", "#9aa3b5", 16);
    sfx.whiff();
    return;
  }

  target.labeled = true;
  target.labelPlu = type.plu;

  if (target.type === typeId) {
    const accuracy = 1 - bestDist / (target.r + 10);
    game.combo++;
    game.labeled++;
    const mult = 1 + Math.min(game.combo - 1, 10) * 0.1;
    let pts = Math.round(100 * mult);
    if (accuracy > 0.75) {
      pts += 50;
      addText(target.x, BELT_Y - 100, "DEAD CENTER +" + pts, "#7CFC9A", 22);
      sfx.perfect();
    } else {
      addText(target.x, BELT_Y - 100, "+" + pts, "#7CFC9A", 20);
      sfx.correct();
    }
    if (game.combo >= 3) addText(target.x, BELT_Y - 128, "x" + game.combo + " combo", "#ffd166", 14);
    game.score += pts;
    addBurst(target.x, BELT_Y - 40, "#7CFC9A", 8);

    // Level up every 8 correct labels
    if (game.labeled % 8 === 0) {
      game.level++;
      game.beltSpeed *= 1.13;
      addText(W / 2, 170, "LEVEL " + game.level + (availableTypes().length > FRUIT_TYPES.filter(f => f.unlockLevel <= game.level - 1).length ? " — NEW FRUIT ON THE LINE!" : " — LINE SPEED UP!"), "#ffd166", 26);
      sfx.levelup();
    }
  } else {
    target.wrong = true;
    sfx.wrong();
    addBurst(target.x, BELT_Y - 40, "#ff6b6b", 12);
    loseLife("MISLABEL! That's a " + FRUIT_TYPES.find(f => f.id === target.type).name, target.x, BELT_Y - 100);
  }
}

function startGame() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  reset();
  game.state = "playing";
}

// ---------- Update ----------
function update(dt) {
  game.time += dt;
  if (game.state !== "playing") return;

  // Spawning
  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    spawnFruit();
    const base = Math.max(0.55, 1.5 - game.level * 0.08);
    game.spawnTimer = base + Math.random() * base * 0.7;
  }

  // Fruit movement
  for (const fr of game.fruits) {
    fr.x += game.beltSpeed * dt;
    fr.rot += game.beltSpeed * dt / fr.r * 0.15;
  }

  // Fruit leaving the belt
  for (let i = game.fruits.length - 1; i >= 0; i--) {
    const fr = game.fruits[i];
    if (fr.x > W + 50) {
      game.fruits.splice(i, 1);
      if (!fr.labeled) {
        sfx.miss();
        loseLife("UNLABELED FRUIT SHIPPED!", W - 140, BELT_Y - 100);
      }
    }
  }

  // Animations
  game.headAnim = Math.max(0, game.headAnim - dt * 6);
  game.shake = Math.max(0, game.shake - dt * 30);
  for (let i = game.texts.length - 1; i >= 0; i--) {
    const t = game.texts[i];
    t.life -= dt * 0.7;
    t.y -= dt * 30;
    if (t.life <= 0) game.texts.splice(i, 1);
  }
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

// ---------- Drawing ----------
function drawBackground() {
  // Factory wall
  const wall = ctx.createLinearGradient(0, 0, 0, H);
  wall.addColorStop(0, "#2c3444");
  wall.addColorStop(1, "#222836");
  ctx.fillStyle = wall;
  ctx.fillRect(0, 0, W, H);

  // Wall panels
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 2;
  for (let x = 60; x < W; x += 160) {
    ctx.strokeRect(x, 30, 130, 250);
  }

  // Hanging sign
  ctx.fillStyle = "#1c212d";
  ctx.fillRect(W - 320, 46, 250, 54);
  ctx.strokeStyle = "#4a5366";
  ctx.strokeRect(W - 320, 46, 250, 54);
  ctx.fillStyle = "#ffd166";
  ctx.font = "bold 17px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("LINE 4 — PLU STATION", W - 195, 70);
  ctx.fillStyle = "#9aa3b5";
  ctx.font = "12px sans-serif";
  ctx.fillText("QUALITY IS EVERYONE'S JOB", W - 195, 90);
}

function drawConveyor() {
  // Frame
  ctx.fillStyle = "#39404f";
  ctx.fillRect(0, BELT_Y + 26, W, 14);
  // Legs
  ctx.fillStyle = "#2d3340";
  for (let x = 70; x < W; x += 220) {
    ctx.fillRect(x, BELT_Y + 38, 16, H - BELT_Y - 38);
  }
  // Belt
  ctx.fillStyle = "#23272f";
  ctx.fillRect(0, BELT_Y, W, 28);
  // Moving belt seams
  const offset = (game.time * (game.state === "playing" ? game.beltSpeed : 40)) % 56;
  ctx.strokeStyle = "#3a3f4a";
  ctx.lineWidth = 3;
  for (let x = -56 + offset; x < W; x += 56) {
    ctx.beginPath();
    ctx.moveTo(x, BELT_Y + 3);
    ctx.lineTo(x - 8, BELT_Y + 25);
    ctx.stroke();
  }
  // Rollers
  ctx.fillStyle = "#454c5c";
  for (let x = 30; x < W; x += 110) {
    ctx.beginPath();
    ctx.arc(x, BELT_Y + 33, 7, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawFruitBody(fr) {
  const y = BELT_Y - fr.r + 4 + Math.sin(game.time * 6 + fr.bobSeed) * 1.5;
  ctx.save();
  ctx.translate(fr.x, y);

  // Shadow on belt
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(0, fr.r - 3, fr.r * 0.9, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(Math.sin(fr.rot) * 0.06);

  if (fr.type === "avocado") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#5d7d3a");
    g.addColorStop(1, "#2f4520");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 2, fr.r * 0.82, fr.r, 0, 0, Math.PI * 2);
    ctx.fill();
    // Bumpy skin speckles
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for (let i = 0; i < 14; i++) {
      const a = i * 2.39996 + fr.bobSeed;
      const rr = (i % 5 + 2) / 7 * fr.r * 0.7;
      ctx.fillRect(Math.cos(a) * rr, Math.sin(a) * rr * 1.15, 2, 2);
    }
  } else if (fr.type === "apple") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#f25c5c");
    g.addColorStop(1, "#a31f2b");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    // Stem + leaf
    ctx.strokeStyle = "#6b4423";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -fr.r + 4);
    ctx.lineTo(2, -fr.r - 7);
    ctx.stroke();
    ctx.fillStyle = "#4f8f3a";
    ctx.beginPath();
    ctx.ellipse(9, -fr.r - 2, 8, 4, -0.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (fr.type === "citrus") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#ffba49");
    g.addColorStop(1, "#e07b00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    // Peel dimples
    ctx.fillStyle = "rgba(160,80,0,0.35)";
    for (let i = 0; i < 12; i++) {
      const a = i * 2.39996 + 1;
      const rr = (i % 4 + 2) / 6 * fr.r * 0.75;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#4f8f3a";
    ctx.beginPath();
    ctx.ellipse(2, -fr.r + 2, 7, 3.5, -0.4, 0, Math.PI * 2);
    ctx.fill();
  } else if (fr.type === "stone") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#ffc09f");
    g.addColorStop(1, "#e8636f");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    // Crease
    ctx.strokeStyle = "rgba(160,50,60,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -fr.r + 3);
    ctx.quadraticCurveTo(6, 0, 0, fr.r - 3);
    ctx.stroke();
    ctx.fillStyle = "#4f8f3a";
    ctx.beginPath();
    ctx.ellipse(-7, -fr.r + 1, 8, 4, 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Highlight
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath();
  ctx.ellipse(-fr.r * 0.35, -fr.r * 0.4, fr.r * 0.22, fr.r * 0.12, -0.6, 0, Math.PI * 2);
  ctx.fill();

  // Sticker
  if (fr.labeled) {
    ctx.save();
    ctx.rotate(-0.15);
    ctx.fillStyle = fr.wrong ? "#ffd5d5" : "#fffbe8";
    ctx.strokeStyle = fr.wrong ? "#d33" : "#ccb";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, -fr.r * 0.25, 16, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = fr.wrong ? "#c0392b" : "#333";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(fr.labelPlu, 0, -fr.r * 0.25 + 3);
    if (fr.wrong) {
      ctx.strokeStyle = "#d33";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-14, -fr.r * 0.25 - 9); ctx.lineTo(14, -fr.r * 0.25 + 9);
      ctx.moveTo(14, -fr.r * 0.25 - 9); ctx.lineTo(-14, -fr.r * 0.25 + 9);
      ctx.stroke();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawLabeler() {
  const ext = game.headAnim;                  // 1 = fully extended
  const pistonLen = 36 + ext * (BELT_Y - 188); // reach toward belt
  ctx.save();
  ctx.translate(LABELER_X, 0);

  // Overhead gantry
  ctx.fillStyle = "#39404f";
  ctx.fillRect(-W / 2, 110, W, 12);
  ctx.fillStyle = "#2d3340";
  ctx.fillRect(-HEAD_W / 2 - 8, 110, HEAD_W + 16, 52);
  ctx.strokeStyle = "#4a5366";
  ctx.strokeRect(-HEAD_W / 2 - 8, 110, HEAD_W + 16, 52);

  // Branding
  ctx.fillStyle = "#ffd166";
  ctx.font = "bold 11px sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("LABELER", 0, 132);
  ctx.fillStyle = "#9aa3b5";
  ctx.font = "9px sans-serif";
  ctx.fillText("MK-IV", 0, 146);

  // Piston
  ctx.fillStyle = "#5b6478";
  ctx.fillRect(-7, 162, 14, pistonLen);
  // Stamp pad
  ctx.fillStyle = "#454c5c";
  ctx.fillRect(-20, 162 + pistonLen, 40, 10);
  // Label on the pad mid-stamp
  if (ext > 0.15 && game.headLabel) {
    const type = FRUIT_TYPES.find(f => f.id === game.headLabel);
    ctx.fillStyle = "#fffbe8";
    ctx.beginPath();
    ctx.ellipse(0, 162 + pistonLen + 14, 14, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#333";
    ctx.font = "bold 8px sans-serif";
    ctx.fillText(type.plu, 0, 162 + pistonLen + 17);
  }

  // Target zone marker on the belt
  ctx.strokeStyle = "rgba(255,209,102,0.5)";
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(-34, BELT_Y - 2);
  ctx.lineTo(-34, BELT_Y + 30);
  ctx.moveTo(34, BELT_Y - 2);
  ctx.lineTo(34, BELT_Y + 30);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawHUD() {
  const s = uiBoost;
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.font = "bold " + Math.round(24 * s) + "px sans-serif";
  ctx.fillText(String(game.score).padStart(6, "0"), 20, 14 + 24 * s);
  ctx.fillStyle = "#9aa3b5";
  ctx.font = Math.round(12 * s) + "px sans-serif";
  ctx.fillText("BEST " + game.best, 20, 14 + 24 * s + 18 * s);

  ctx.fillText("LEVEL " + game.level, 20, 14 + 24 * s + 36 * s);

  // Lives as stickers
  for (let i = 0; i < 3; i++) {
    const x = 130 + 90 * s + i * 36;
    ctx.fillStyle = i < game.lives ? "#fffbe8" : "rgba(255,255,255,0.12)";
    ctx.strokeStyle = i < game.lives ? "#ccb" : "rgba(255,255,255,0.15)";
    ctx.beginPath();
    ctx.ellipse(x, 32, 14, 9, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (i < game.lives) {
      ctx.fillStyle = "#333";
      ctx.font = "bold 8px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PLU", x, 35);
      ctx.textAlign = "left";
    }
  }

  if (game.combo >= 3) {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold " + Math.round(16 * s) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COMBO x" + game.combo, W / 2, 24 + 16 * s);
  }
}

function drawTextsAndParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const t of game.texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 2));
    ctx.fillStyle = t.color;
    ctx.font = "bold " + Math.round(t.size * uiBoost) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawOverlay() {
  if (game.state === "playing") return;
  ctx.fillStyle = "rgba(15,18,26,0.78)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";

  const s = uiBoost;
  if (game.state === "menu") {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold " + Math.round(Math.min(52 * s, 66)) + "px sans-serif";
    ctx.fillText("FRUIT LABELING HERO", W / 2, 140);
    ctx.fillStyle = "#fff";
    ctx.font = Math.round(20 * s) + "px sans-serif";
    ctx.fillText("Stick the RIGHT PLU label on every fruit", W / 2, 210);
    ctx.fillText("as it passes under the labeling head.", W / 2, 210 + 30 * s);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(16 * s) + "px sans-serif";
    ctx.fillText("Tap the label buttons (or keys 1–4)", W / 2, 230 + 64 * s);
    ctx.fillText("Wrong label or unlabeled fruit = strike.", W / 2, 230 + 90 * s);
    ctx.fillText("Three strikes and the shift is over.", W / 2, 230 + 116 * s);
    ctx.fillStyle = "#7CFC9A";
    ctx.font = "bold " + Math.round(22 * s) + "px sans-serif";
    ctx.fillText(blink() ? "TAP ANY LABEL TO CLOCK IN" : "", W / 2, 250 + 160 * s);
  } else if (game.state === "paused") {
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.round(40 * s) + "px sans-serif";
    ctx.fillText("LINE STOPPED", W / 2, H / 2 - 10);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(18 * s) + "px sans-serif";
    ctx.fillText("Press P to restart the conveyor", W / 2, H / 2 + 22 + 18 * s);
  } else if (game.state === "gameover") {
    ctx.fillStyle = "#ff6b6b";
    ctx.font = "bold " + Math.round(44 * s) + "px sans-serif";
    ctx.fillText("SHIFT OVER", W / 2, 170);
    ctx.fillStyle = "#fff";
    ctx.font = Math.round(26 * s) + "px sans-serif";
    ctx.fillText("Score: " + game.score, W / 2, 180 + 56 * s);
    ctx.fillStyle = game.score >= game.best && game.score > 0 ? "#ffd166" : "#9aa3b5";
    ctx.font = Math.round(18 * s) + "px sans-serif";
    ctx.fillText(game.score >= game.best && game.score > 0 ? "NEW PLANT RECORD!" : "Plant record: " + game.best, W / 2, 190 + 86 * s);
    ctx.fillStyle = "#7CFC9A";
    ctx.font = "bold " + Math.round(20 * s) + "px sans-serif";
    ctx.fillText(blink() ? "TAP ANY LABEL FOR NEXT SHIFT" : "", W / 2, 220 + 140 * s);
  }
}

function blink() {
  return Math.floor(game.time * 2) % 2 === 0;
}

function draw() {
  ctx.save();
  if (game.shake > 0) {
    ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  }
  drawBackground();
  drawConveyor();
  for (const fr of game.fruits) drawFruitBody(fr);
  drawLabeler();
  drawTextsAndParticles();
  drawHUD();
  ctx.restore();
  drawOverlay();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  updateUiBoost();
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Controls ----------
const controlsEl = document.getElementById("controls");
const buttons = {};
for (const f of FRUIT_TYPES) {
  const b = document.createElement("button");
  b.className = "label-btn";
  b.innerHTML = `<span class="fruit">${f.emoji}</span><span class="plu">${f.plu}</span><span class="key">${f.name} — ${f.key}</span>`;
  b.addEventListener("pointerdown", e => { e.preventDefault(); fireLabel(f.id); });
  controlsEl.appendChild(b);
  buttons[f.id] = b;
}

function flashButton(typeId) {
  const b = buttons[typeId];
  b.classList.add("flash");
  setTimeout(() => b.classList.remove("flash"), 100);
}

window.addEventListener("keydown", e => {
  if (e.repeat) return;
  const f = FRUIT_TYPES.find(t => t.key === e.key);
  if (f) { e.preventDefault(); fireLabel(f.id); return; }
  if (e.key === "p" || e.key === "P") {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }
  if ((e.key === "Enter" || e.key === " ") && (game.state === "menu" || game.state === "gameover")) {
    e.preventDefault();
    startGame();
  }
});
canvas.addEventListener("pointerdown", () => {
  if (game.state === "menu" || game.state === "gameover") startGame();
});
</script>
