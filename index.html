<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1e28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fruit Labeling Hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #14181f;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #eee;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
  }
  #game {
    background: #222836;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    width: min(100%, calc((100dvh - 12px) * 9 / 16));
    aspect-ratio: 9 / 16;
    touch-action: none; /* full multi-touch: no browser gestures on the play area */
  }
  /* ---- Player name + Top 100 leaderboard (ported from Nemo's adventure) ---- */
  #nameBtn, #lbBtn {
    position: fixed;
    top: max(10px, env(safe-area-inset-top));
    z-index: 5;
    font: bold 14px -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff;
    background: rgba(34, 40, 54, 0.85);
    border: 2px solid #ffd166;
    border-radius: 18px;
    padding: 7px 14px;
    cursor: pointer;
  }
  #nameBtn { left: 10px; }
  #lbBtn { right: 10px; }
  body.inplay #nameBtn, body.inplay #lbBtn { display: none; }
  #lbOverlay, #nameOverlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(8, 11, 18, 0.78);
  }
  #lbOverlay.open, #nameOverlay.open { display: flex; }
  #lbCard {
    background: #2b3140;
    border: 3px solid #ffd166;
    border-radius: 16px;
    padding: 16px;
    width: min(88vw, 360px);
    max-height: 78vh;
    display: flex;
    flex-direction: column;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff;
  }
  #lbCard h2 { font-size: 20px; color: #ffd166; text-align: center; margin-bottom: 2px; }
  #lbCard .lbSub { font-size: 12px; color: #9aa3b5; text-align: center; margin-bottom: 10px; }
  #lbList { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .lbRow { display: flex; align-items: center; padding: 7px 6px; border-bottom: 1px solid rgba(255,255,255,0.12); font-size: 15px; }
  .lbRow .rank { width: 36px; color: #9aa3b5; font-weight: 600; }
  .lbRow .nm { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lbRow .nm.me { color: #ffd166; }
  .lbRow .sc { font-weight: 800; color: #ffd166; margin-left: 8px; }
  #lbClose, #nameSave {
    margin-top: 12px;
    font: bold 16px inherit;
    color: #2b2410;
    background: #ffd166;
    border: none;
    border-radius: 10px;
    padding: 10px 26px;
    cursor: pointer;
  }
  #nameCard {
    background: #2b3140;
    border: 3px solid #ffd166;
    border-radius: 16px;
    padding: 22px;
    width: min(82vw, 320px);
    text-align: center;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff;
  }
  #nameCard h2 { margin-bottom: 12px; font-size: 20px; color: #ffd166; }
  #nameInput {
    width: 100%;
    font: bold 18px inherit;
    text-align: center;
    padding: 9px;
    border: 2px solid #5b6478;
    border-radius: 10px;
    background: #fff;
    color: #2b2410;
    margin-bottom: 2px;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
</div>
<button id="nameBtn" type="button">👤</button>
<button id="lbBtn" type="button">🏆 Top 100</button>
<div id="lbOverlay">
  <div id="lbCard">
    <h2>🏆 TOP 100</h2>
    <div class="lbSub" id="lbSub">loading…</div>
    <div id="lbList"></div>
    <button id="lbClose" type="button">Close</button>
  </div>
</div>
<div id="nameOverlay">
  <div id="nameCard">
    <h2>What's your name?</h2>
    <input id="nameInput" maxlength="12" autocomplete="off" placeholder="Hero">
    <br>
    <button id="nameSave" type="button">Save</button>
  </div>
</div>

<script>
"use strict";

// ---------- Setup ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const LANES = 4;
const LANE_W = W / LANES;
const laneX = i => LANE_W * (i + 0.5);

const LABELER_Y = 700;        // low on screen: easy thumb reach
const STAMP_WINDOW = 16;      // extra reach beyond fruit radius
const CUP_PITCH = 112;        // spacing between carrier cups along the belt
const START_CPS = 1.5;        // line speed at clock-in, in cups per second
const CPS_PER_LEVEL = 0.25;   // line speed gained at every commodity changeover
const STAGE_SIZE = 30;        // fruits per commodity run
const CRIT_STREAK = 3;        // perfect hits in a row for a critical strike

const COMMODITIES = [
  { id: "avocado", name: "AVOCADOS", plu: "4046" },
  { id: "apple",   name: "APPLES",   plu: "4131" },
  { id: "citrus",  name: "ORANGES",  plu: "4012" },
  { id: "stone",   name: "PEACHES",  plu: "4044" },
];

// Per-commodity color themes: the whole plant re-lights at every changeover
const THEMES = {
  avocado: { bg1: "#22301c", bg2: "#182310", rail: "#3d4d33", cup: "#2c3627", accent: "#9dc964", juice: "#6d8d44" },
  apple:   { bg1: "#33201f", bg2: "#251313", rail: "#523a38", cup: "#382b2a", accent: "#f28282", juice: "#c23b35" },
  citrus:  { bg1: "#332813", bg2: "#251b0a", rail: "#524526", cup: "#383122", accent: "#ffc76b", juice: "#e08a10" },
  stone:   { bg1: "#321f27", bg2: "#241318", rail: "#503a44", cup: "#372a30", accent: "#ffadad", juice: "#e8737f" },
};
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
const themeCur = {};
function setThemeInstant(id) {
  for (const k in THEMES[id]) themeCur[k] = hexRgb(THEMES[id][k]);
}
function lerpTheme(dt) {
  const t = THEMES[game.commodity.id];
  const f = 1 - Math.exp(-dt * 2.5);
  for (const k in t) {
    const target = hexRgb(t[k]);
    const cur = themeCur[k] || (themeCur[k] = target.slice());
    for (let i = 0; i < 3; i++) cur[i] += (target[i] - cur[i]) * f;
  }
}
function tc(k, a) {
  const c = themeCur[k];
  return a !== undefined ? `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})` : `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
}
// phone vibration: a tiny thump on every stamp, a pattern on the big moments
function buzz(p) { if (navigator.vibrate) try { navigator.vibrate(p); } catch (e) {} }

// Text boost so HUD/messages stay readable when the canvas is shrunk on phones
let uiBoost = 1;
function updateUiBoost() {
  const cw = canvas.clientWidth || W;
  uiBoost = Math.min(1.3, Math.max(1, 460 / cw));
}

// ---------- Audio ----------
let audioCtx = null;
function beep(freq, dur, type = "sine", vol = 0.15, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  stamp:    () => { beep(120, 0.07, "square", 0.18); },
  correct:  () => { beep(660, 0.08, "sine", 0.12); beep(880, 0.12, "sine", 0.12, 0.07); },
  perfect:  () => { beep(660, 0.07, "sine", 0.12); beep(880, 0.07, "sine", 0.12, 0.06); beep(1320, 0.14, "sine", 0.12, 0.12); },
  crit:     () => { [880, 1175, 1760].forEach((f, i) => beep(f, 0.12, "sine", 0.16, i * 0.06)); beep(2200, 0.25, "sine", 0.12, 0.18); },
  whiff:    () => { beep(300, 0.06, "triangle", 0.08); },
  miss:     () => { beep(220, 0.15, "square", 0.12); beep(150, 0.25, "square", 0.12, 0.12); },
  speedup:  () => { beep(523, 0.1, "sine", 0.12); beep(784, 0.16, "sine", 0.12, 0.09); },
  thud:     () => { beep(80, 0.2, "sine", 0.35); beep(45, 0.3, "sine", 0.25, 0.02); },
  changeover:() => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, "sine", 0.12, i * 0.09)); },
  gameover: () => { [392, 330, 262, 196].forEach((f, i) => beep(f, 0.25, "triangle", 0.15, i * 0.2)); },
};

// ---------- Game state ----------
const game = {
  state: "menu",              // menu | playing | paused | gameover
  rows: [],                   // carrier cup rows riding the belt (all lanes)
  fruits: [],
  texts: [],
  particles: [],
  score: 0,
  best: Number(localStorage.getItem("flh-best") || 0),
  lives: 3,
  perfectStreak: 0,
  critCount: 0,
  critTimer: 0,
  critX: 0,
  critY: 0,
  slamT: 0,                   // commodity sticker slam animation (seconds left)
  slamHit: false,
  slowmo: 0,                  // crit slow-motion (seconds left)
  beltSpeed: START_CPS * CUP_PITCH,
  processed: 0,               // fruits past the labelers (labeled or missed)
  levelCount: 0,              // stage progress (crits add a bonus fruit)
  commodity: COMMODITIES[0],
  commodityQueue: [],
  shift: 1,
  changeover: false,          // draining the belt before the next commodity
  pattern: [],                // randomized lane order for upcoming spawns
  stampAnims: [0, 0, 0, 0],   // per-lane labeler stamp animation
  fingerRot: 0,
  shake: 0,
  time: 0,
};

function pickCommodity() {
  if (game.commodityQueue.length === 0) {
    const q = COMMODITIES.slice();
    for (let i = q.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [q[i], q[j]] = [q[j], q[i]];
    }
    // Avoid repeating the commodity we just ran
    if (q[0].id === game.commodity.id && q.length > 1) [q[0], q[1]] = [q[1], q[0]];
    game.commodityQueue = q;
  }
  return game.commodityQueue.shift();
}

function reset() {
  game.fruits = [];
  game.texts = [];
  game.particles = [];
  game.score = 0;
  game.lives = 3;
  game.perfectStreak = 0;
  game.critCount = 0;
  game.critTimer = 0;
  game.beltSpeed = START_CPS * CUP_PITCH;
  game.processed = 0;
  game.levelCount = 0;
  game.commodityQueue = [];
  game.commodity = pickCommodity();
  setThemeInstant(game.commodity.id);
  game.shift = 1;
  game.slamT = 0;
  game.slowmo = 0;
  game.changeover = false;
  game.pattern = [];
  game.stampAnims = [0, 0, 0, 0];
  game.shake = 0;
}

// ---------- Cup rows & spawning: randomized lane patterns ----------
function nextPatternLane() {
  if (game.pattern.length === 0) {
    const p = [0, 1, 2, 3];
    for (let i = p.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    game.pattern = p;
  }
  return game.pattern.shift();
}

function spawnFruit(lane, y) {
  game.fruits.push({
    lane,
    x: laneX(lane),
    y,
    r: 26 + Math.random() * 5,
    type: game.commodity.id,
    plu: game.commodity.plu,
    labeled: false,
    missed: false,
    rot: Math.random() * Math.PI * 2,
    bobSeed: Math.random() * 10,
  });
}

function makeRow(y, fillable) {
  game.rows.push({ y });
  if (!fillable || game.state !== "playing" || game.changeover) return;

  // Randomized fill: empty rows, singles from a shuffled bag, doubles at speed
  const doubleChance = Math.min(0.28, 0.06 + (game.shift - 1) * 0.05);
  const r = Math.random();
  if (r < 0.25) return;                                   // empty cups ride through
  const lane = nextPatternLane();
  spawnFruit(lane, y);
  if (r < 0.25 + doubleChance) {                          // simultaneous pair
    const others = [0, 1, 2, 3].filter(l => l !== lane);
    spawnFruit(others[Math.floor(Math.random() * others.length)], y);
  }
}

function ensureRows(fillable) {
  let maxY = -CUP_PITCH;
  for (const row of game.rows) maxY = Math.max(maxY, row.y);
  while (maxY < H + 70) {
    maxY += CUP_PITCH;
    makeRow(maxY, fillable && maxY > H);  // only fill rows entering from below screen
  }
}
ensureRows(false); // pre-populate the belt with empty cups

// ---------- Feedback helpers ----------
function addText(x, y, str, color, size = 20) {
  // Keep long messages on-screen when they originate near an edge lane
  const half = str.length * size * uiBoost * 0.29;
  x = Math.max(Math.min(half + 8, W / 2), Math.min(x, W - Math.min(half + 8, W / 2)));
  game.texts.push({ x, y, str, color, size, life: 1 });
}

function addBurst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 140;
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.6, color });
  }
}

function loseLife(reason, x, y) {
  buzz(60);
  game.lives--;
  game.perfectStreak = 0;
  game.shake = 8;
  addText(x, y, reason, "#ff6b6b", 20);
  if (game.lives <= 0) {
    game.state = "gameover";
    if (game.score > game.best) {
      game.best = game.score;
      localStorage.setItem("flh-best", String(game.best));
    }
    if (game.score > 0) {
      addToLB(playerName, game.score);
      pushRemoteScore(playerName, game.score);
    }
    logPlay(game.score);
    sfx.gameover();
  }
}

// ---------- Throughput milestones ----------
function bumpStage(n) {
  game.levelCount += n;
  if (game.levelCount >= STAGE_SIZE && !game.changeover) {
    game.changeover = true; // stop filling cups, drain the belt, then switch
  }
}

function fruitProcessed() {
  game.processed++;
  bumpStage(1);
}

function completeChangeover() {
  game.changeover = false;
  game.levelCount = 0;
  game.shift++;
  game.commodity = pickCommodity();
  game.beltSpeed += CPS_PER_LEVEL * CUP_PITCH;
  game.slamT = 1.4;
  game.slamHit = false;
  addText(W / 2, LABELER_Y - 168, "LINE SPEED UP: " + (game.beltSpeed / CUP_PITCH).toFixed(2) + " CUPS/SEC", "#ffd166", 16);
  sfx.speedup();
  sfx.changeover();
}

// ---------- Input: fire the labeler on a lane ----------
function tapLane(lane) {
  if (game.state !== "playing") return;
  game.stampAnims[lane] = 1;
  sfx.stamp();
  buzz(12);

  let target = null, bestDist = Infinity;
  for (const fr of game.fruits) {
    if (fr.lane !== lane || fr.labeled || fr.missed) continue;
    const d = Math.abs(fr.y - LABELER_Y);
    if (d <= fr.r + STAMP_WINDOW && d < bestDist) { bestDist = d; target = fr; }
  }

  if (!target) {
    addText(laneX(lane), LABELER_Y - 50, "NO FRUIT", "#9aa3b5", 13);
    sfx.whiff();
    return;
  }

  target.labeled = true;
  target.squash = 1;  // fruit compresses under the stamp
  target.stickT = 1;  // sticker slaps on big and settles
  const accuracy = 1 - bestDist / (target.r + STAMP_WINDOW);
  let pts = 1; // simple scoring: one point per labeled fruit

  if (accuracy > 0.75) {
    game.perfectStreak++;

    if (game.perfectStreak >= CRIT_STREAK) {
      // CRITICAL STRIKE: counts as 2 points + one fruit off the stage total
      game.perfectStreak = 0;
      game.critCount++;
      pts = 2;
      game.critTimer = 1;
      game.critX = target.x;
      game.critY = LABELER_Y;
      game.shake = 6;
      addText(target.x, LABELER_Y - 70, "CRITICAL STRIKE!", "#ffd166", 26);
      addText(target.x, LABELER_Y - 38, "+2 · −1 FRUIT TO STAGE", "#7CFC9A", 15);
      addBurst(target.x, LABELER_Y, "#ffd166", 22);
      addBurst(target.x, LABELER_Y, THEMES[target.type].juice, 16);
      game.slowmo = 0.4; // savor it
      buzz([30, 40, 70]);
      sfx.crit();
      bumpStage(1); // the bonus fruit
    } else {
      addText(target.x, LABELER_Y - 50, "DEAD CENTER +1", "#7CFC9A", 18);
      addBurst(target.x, LABELER_Y, THEMES[target.type].juice, 14);
      sfx.perfect();
    }
  } else {
    game.perfectStreak = 0;
    addText(target.x, LABELER_Y - 50, "+1", "#7CFC9A", 17);
    addBurst(target.x, LABELER_Y, THEMES[target.type].juice, 8);
    sfx.correct();
  }

  game.score += pts;
  fruitProcessed();
}

function startGame() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  reset();
  refreshRemoteLB(); // keep the global top-100 fresh between runs
  game.state = "playing";
  game.slamT = 1.4; // slam the first commodity's sticker down
  game.slamHit = false;
}

// ---------- Player name + Top 100 leaderboard (ported from Nemo's adventure) ----------
const VERSION = "v1";
const nameBtn = document.getElementById("nameBtn");
const nameOverlay = document.getElementById("nameOverlay");
const nameInput = document.getElementById("nameInput");
const nameSave = document.getElementById("nameSave");
const lbBtn = document.getElementById("lbBtn");
const lbOverlay = document.getElementById("lbOverlay");
const lbList = document.getElementById("lbList");
const lbSub = document.getElementById("lbSub");
const lbClose = document.getElementById("lbClose");

// First visit on this device: borrow the name the player already uses in
// Nemo's adventure, if there is one.
let playerName = localStorage.getItem("flhName") || localStorage.getItem("royalNemoName") || "";
// permanent unique id for this device: renames only ever touch scores
// carrying this id, so one player can never hijack another's entries
let PID = localStorage.getItem("flhPid");
if (!PID) {
  PID = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("flhPid", PID);
}
function getLB() {
  try { return JSON.parse(localStorage.getItem("flhLB")) || []; }
  catch (e) { return []; }
}
function saveLB(lb) {
  localStorage.setItem("flhLB", JSON.stringify(lb));
}
function addToLB(name, sc) {
  const lb = getLB();
  lb.push({ name, score: sc, pid: PID });
  lb.sort((a, b) => b.score - a.score);
  saveLB(lb.slice(0, 100));
}
function setName(newName) {
  newName = (newName || "").trim().slice(0, 12) || "Hero";
  // renaming carries all of your existing leaderboard scores with you
  const oldName = playerName;
  const lb = getLB();
  for (const e of lb) e.name = newName; // the local board is this device's own scores
  saveLB(lb);
  playerName = newName;
  localStorage.setItem("flhName", newName);
  nameBtn.textContent = "👤 " + newName;
  renameRemote(oldName, newName);
}

// Cross-device leaderboard (Firebase Realtime DB over REST) — same database
// as Nemo's adventure, namespaced under /flh so the two boards never mix.
// Empty string = this device only.
const REMOTE_DB = "https://royal-nemo-default-rtdb.firebaseio.com";
const SCORES_PATH = "/flh/scores.json";
const PLAYS_PATH = "/flh/plays.json";
let remoteLB = null; // latest fetched global top-100

function lbTop() {
  return remoteLB || getLB();
}
async function refreshRemoteLB() {
  if (!REMOTE_DB) return;
  try {
    const res = await fetch(REMOTE_DB + SCORES_PATH);
    const data = await res.json() || {};
    const all = Object.values(data).filter(e => e && e.name && typeof e.score === "number");
    all.sort((a, b) => b.score - a.score);
    remoteLB = all.slice(0, 100);
  } catch (e) { /* offline: keep showing the last list we had */ }
}
function pushRemoteScore(name, sc) {
  if (!REMOTE_DB) return;
  fetch(REMOTE_DB + SCORES_PATH, {
    method: "POST",
    body: JSON.stringify({ name, score: sc, ts: Date.now(), pid: PID })
  }).then(refreshRemoteLB).catch(() => {});
}
async function renameRemote(oldName, newName) {
  if (!REMOTE_DB || oldName === newName) return;
  try {
    const res = await fetch(REMOTE_DB + SCORES_PATH);
    const data = await res.json() || {};
    const updates = {};
    for (const [k, e] of Object.entries(data)) {
      if (e && e.pid === PID) updates[k + "/name"] = newName;
    }
    if (Object.keys(updates).length) {
      await fetch(REMOTE_DB + SCORES_PATH, { method: "PATCH", body: JSON.stringify(updates) });
    }
    refreshRemoteLB();
  } catch (e) { /* offline */ }
}
// developer-only play log: one entry per finished run, written to a node
// the public can't read (viewable on the Firebase console / admin dashboard)
function logPlay(finalScore) {
  if (!REMOTE_DB) return;
  try {
    fetch(REMOTE_DB + PLAYS_PATH, {
      method: "POST",
      body: JSON.stringify({ name: playerName, ts: Date.now(), v: VERSION, score: finalScore, shift: game.shift, fruits: game.processed, crits: game.critCount })
    }).catch(() => {});
  } catch (e) { /* logging is best-effort */ }
}

function escapeHtml(x) {
  return String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function renderLBOverlay() {

// ---------- Update ----------
function update(dt) {
  game.time += dt;
  lerpTheme(dt);
  // crit slow-motion: the world runs at 30% while the flash plays
  let world = dt;
  if (game.slowmo > 0) {
    world = dt * 0.3;
    game.slowmo = Math.max(0, game.slowmo - dt);
  }
  // commodity sticker slam: impact effects when it lands
  if (game.slamT > 0) {
    game.slamT = Math.max(0, game.slamT - dt);
    if (!game.slamHit && game.slamT <= 1.15) {
      game.slamHit = true;
      game.shake = 10;
      sfx.thud();
      buzz(40);
    }
  }
  game.fingerRot += world * 2.2;
  if (game.state === "paused" || game.state === "gameover") return;

  // Belt advance: cups always ride (idle speed on the menu)
  const adv = (game.state === "playing" ? game.beltSpeed : 60) * world;
  for (const row of game.rows) row.y -= adv;
  for (let i = game.rows.length - 1; i >= 0; i--) {
    if (game.rows[i].y < -70) game.rows.splice(i, 1);
  }
  ensureRows(true);

  if (game.state !== "playing") return;

  if (game.changeover && game.fruits.length === 0) completeChangeover();

  // Fruit rides the cups
  for (const fr of game.fruits) {
    fr.y -= adv;
    fr.rot += adv / fr.r * 0.1;
    if (fr.squash) fr.squash = Math.max(0, fr.squash - world * 5);
    if (fr.stickT) fr.stickT = Math.max(0, fr.stickT - world * 6);
    // Passed the labeler unlabeled = missed
    if (!fr.labeled && !fr.missed && fr.y < LABELER_Y - fr.r - STAMP_WINDOW) {
      fr.missed = true;
      sfx.miss();
      loseLife("MISSED!", fr.x, LABELER_Y - 60);
      fruitProcessed();
    }
  }
  for (let i = game.fruits.length - 1; i >= 0; i--) {
    if (game.fruits[i].y < -50) game.fruits.splice(i, 1);
  }

  // Animations
  for (let l = 0; l < LANES; l++) game.stampAnims[l] = Math.max(0, game.stampAnims[l] - world * 5);
  game.critTimer = Math.max(0, game.critTimer - dt * 1.4);
  game.shake = Math.max(0, game.shake - dt * 30);
  for (let i = game.texts.length - 1; i >= 0; i--) {
    const t = game.texts[i];
    t.life -= world * 0.6;
    t.y -= world * 26;
    if (t.life <= 0) game.texts.splice(i, 1);
  }
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= world;
    p.x += p.vx * world;
    p.y += p.vy * world;
    p.vy += 400 * world;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

// ---------- Drawing ----------
function drawBelts() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, tc("bg1"));
  g.addColorStop(1, tc("bg2"));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Lane rails
  for (let l = 0; l <= LANES; l++) {
    const x = l * LANE_W;
    ctx.fillStyle = tc("rail");
    ctx.fillRect(x - 4, 0, 8, H);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(x + 2, 0, 2, H);
  }
}

function drawCups() {
  for (const row of game.rows) {
    for (let l = 0; l < LANES; l++) {
      const x = laneX(l), y = row.y;
      // Carrier tray
      ctx.fillStyle = tc("cup");
      ctx.strokeStyle = tc("rail");
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x - 48, y - 42, 96, 84, 14);
      ctx.fill();
      ctx.stroke();
      // Cup depression
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.beginPath();
      ctx.ellipse(x, y, 36, 30, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.beginPath();
      ctx.ellipse(x, y, 36, 30, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function drawFruitTop(fr) {
  const wob = Math.sin(game.time * 6 + fr.bobSeed) * 1.2;
  ctx.save();
  ctx.translate(fr.x + wob, fr.y);

  // Shadow inside the cup
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(3, 4, fr.r * 0.95, fr.r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(Math.sin(fr.rot) * 0.1);
  if (fr.squash) ctx.scale(1 + fr.squash * 0.16, 1 - fr.squash * 0.22); // compressed under the stamp

  if (fr.type === "avocado") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#5d7d3a");
    g.addColorStop(1, "#2f4520");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, fr.r * 0.78, fr.r, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for (let i = 0; i < 14; i++) {
      const a = i * 2.39996 + fr.bobSeed;
      const rr = (i % 5 + 2) / 7 * fr.r * 0.65;
      ctx.fillRect(Math.cos(a) * rr, Math.sin(a) * rr, 2, 2);
    }
  } else if (fr.type === "apple") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#f25c5c");
    g.addColorStop(1, "#a31f2b");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(90,30,30,0.5)";
    ctx.beginPath();
    ctx.arc(0, 0, fr.r * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#6b4423";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(5, -7);
    ctx.stroke();
  } else if (fr.type === "citrus") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#ffba49");
    g.addColorStop(1, "#e07b00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(160,80,0,0.35)";
    for (let i = 0; i < 12; i++) {
      const a = i * 2.39996 + 1;
      const rr = (i % 4 + 2) / 6 * fr.r * 0.75;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#4f8f3a";
    ctx.beginPath();
    ctx.arc(0, 0, fr.r * 0.12, 0, Math.PI * 2);
    ctx.fill();
  } else if (fr.type === "stone") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#ffc09f");
    g.addColorStop(1, "#e8636f");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "rgba(160,50,60,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(fr.r * 0.3, fr.r * 0.5, fr.r * 0.15, fr.r * 0.95);
    ctx.stroke();
  }

  // Highlight
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath();
  ctx.ellipse(-fr.r * 0.35, -fr.r * 0.4, fr.r * 0.22, fr.r * 0.12, -0.6, 0, Math.PI * 2);
  ctx.fill();

  // PLU sticker
  if (fr.labeled) {
    ctx.save();
    ctx.rotate(-0.15);
    if (fr.stickT) { const st = 1 + fr.stickT * 1.3; ctx.scale(st, st); } // slaps on big, settles
    ctx.fillStyle = "#fffbe8";
    ctx.strokeStyle = "#ccb";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(fr.plu, 0, 3);
    ctx.restore();
  }
  if (fr.missed) {
    ctx.strokeStyle = "#ff6b6b";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
    ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
    ctx.stroke();
  }
  ctx.restore();
}

function drawLabelers() {
  // Per-lane stamp pulses (under the bridge, on the fruit)
  for (let l = 0; l < LANES; l++) {
    const a = game.stampAnims[l];
    if (a > 0) {
      ctx.strokeStyle = "rgba(255,209,102," + (a * 0.9) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(laneX(l), LABELER_Y, 14 + (1 - a) * 26, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Gantry bridge across all lanes
  ctx.fillStyle = "rgba(45,51,64,0.88)";
  ctx.fillRect(0, LABELER_Y - 14, W, 28);
  ctx.strokeStyle = "#4a5366";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, LABELER_Y - 14, W, 28);

  // Stamp window guides per lane
  ctx.strokeStyle = "rgba(255,209,102,0.35)";
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  for (let l = 0; l < LANES; l++) {
    const x = laneX(l);
    ctx.beginPath();
    ctx.moveTo(x - 32, LABELER_Y + 44);
    ctx.lineTo(x + 32, LABELER_Y + 44);
    ctx.moveTo(x - 32, LABELER_Y - 44);
    ctx.lineTo(x + 32, LABELER_Y - 44);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // A labeler head fixed on every lane
  for (let l = 0; l < LANES; l++) {
    const cx = laneX(l);
    ctx.fillStyle = "#454c5c";
    ctx.fillRect(cx - 28, LABELER_Y - 20, 56, 40);
    ctx.strokeStyle = "#5b6478";
    ctx.strokeRect(cx - 28, LABELER_Y - 20, 56, 40);

    // Rotary bellows fingers; the head dips when stamping
    const headR = 15;
    const squash = 1 - game.stampAnims[l] * 0.35;
    ctx.save();
    ctx.translate(cx, LABELER_Y);
    ctx.scale(squash, squash);
    ctx.fillStyle = "#39404f";
    ctx.beginPath();
    ctx.arc(0, 0, headR, 0, Math.PI * 2);
    ctx.fill();
    for (let i = 0; i < 4; i++) {
      const a = game.fingerRot + l * 0.8 + i * Math.PI / 2;
      ctx.fillStyle = "#ffd166";
      ctx.beginPath();
      ctx.arc(Math.cos(a) * headR, Math.sin(a) * headR, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = "#fffbe8";
    ctx.beginPath();
    ctx.ellipse(0, 0, 8.5, 5.5, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = "#9aa3b5";
  ctx.font = "bold 10px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("LABELER MK-V", 8, LABELER_Y - 20);

  // Perfect-streak pips: progress toward a critical strike
  if (game.state === "playing") {
    const px = W / 2 - (CRIT_STREAK - 1) * 11;
    for (let i = 0; i < CRIT_STREAK; i++) {
      ctx.fillStyle = i < game.perfectStreak ? "#ffd166" : "rgba(255,255,255,0.15)";
      ctx.beginPath();
      ctx.arc(px + i * 22, LABELER_Y + 62, 5, 0, Math.PI * 2);
      ctx.fill();
    }
    if (game.perfectStreak > 0) {
      ctx.fillStyle = "rgba(255,209,102,0.8)";
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PERFECT x" + game.perfectStreak + " — " + (CRIT_STREAK - game.perfectStreak) + " TO CRIT", W / 2, LABELER_Y + 84);
    }
  }
}

function drawCritFX() {
  if (game.critTimer <= 0) return;
  const t = 1 - game.critTimer;
  // Expanding gold rings from the strike point
  for (let i = 0; i < 3; i++) {
    ctx.strokeStyle = "rgba(255,209,102," + (game.critTimer * 0.85) + ")";
    ctx.lineWidth = 4 - i;
    ctx.beginPath();
    ctx.arc(game.critX, game.critY, 18 + t * 150 + i * 28, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Radiating spokes
  ctx.strokeStyle = "rgba(255,235,170," + (game.critTimer * 0.7) + ")";
  ctx.lineWidth = 3;
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4 + t * 0.6;
    const r1 = 24 + t * 90, r2 = r1 + 26;
    ctx.beginPath();
    ctx.moveTo(game.critX + Math.cos(a) * r1, game.critY + Math.sin(a) * r1);
    ctx.lineTo(game.critX + Math.cos(a) * r2, game.critY + Math.sin(a) * r2);
    ctx.stroke();
  }
  // Full-screen gold flash
  ctx.fillStyle = "rgba(255,215,100," + (game.critTimer * 0.16) + ")";
  ctx.fillRect(0, 0, W, H);
}

// Speed vignette: the screen edges glow in the commodity color as the line gets fast
function drawVignette() {
  const a = Math.min(0.3, Math.max(0, (game.beltSpeed / CUP_PITCH - 1.5) * 0.09));
  if (a <= 0.01) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.7);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, tc("accent", a.toFixed(3)));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// Commodity changeover: a giant PLU sticker slams down onto the screen
function drawSlam() {
  if (game.slamT <= 0) return;
  const p = 1.4 - game.slamT;             // elapsed
  const drop = Math.max(0, 1 - p / 0.25); // 1 -> 0 while falling in
  const sc = 1 + drop * drop * 2.4;
  const alpha = Math.min(1, game.slamT / 0.3);
  const rot = -0.1 + 0.1 * Math.min(1, p / 0.4);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W / 2, H * 0.42);
  ctx.rotate(rot);
  ctx.scale(sc, sc);
  ctx.fillStyle = "#fffbe8";
  ctx.strokeStyle = tc("accent");
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.ellipse(0, 0, 170, 100, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#2b2410";
  ctx.textAlign = "center";
  ctx.font = "bold 40px sans-serif";
  ctx.fillText(game.commodity.name, 0, -8);
  ctx.font = "bold 30px sans-serif";
  ctx.fillText("PLU " + game.commodity.plu, 0, 34);
  let bx = -60; // a little barcode, because every real sticker has one
  for (let i = 0; bx < 60; i++) {
    const w = (i * 7 % 5) + 1;
    ctx.fillRect(bx, 52, w, 16);
    bx += w + 3;
  }
  ctx.restore();
  if (p > 0.22 && p < 0.35) { // impact flash
    ctx.fillStyle = "rgba(255,255,255," + (0.25 * (1 - (p - 0.22) / 0.13)).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
  }
  ctx.globalAlpha = 1;
}

const PAUSE_BTN = { x: W - 50, y: 10, w: 40, h: 40 };
function drawHUD() {
  const s = uiBoost;

  const grad = ctx.createLinearGradient(0, 0, 0, 160);
  grad.addColorStop(0, "rgba(10,12,18,0.85)");
  grad.addColorStop(1, "rgba(10,12,18,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 160);

  // Big score, top left
  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";

  ctx.fillStyle = "#9aa3b5";
  ctx.font = Math.round(13 * s) + "px sans-serif";
  ctx.fillText("BEST " + game.best, 14, 10 + 44 * s + 18 * s);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd166";
  ctx.font = "bold " + Math.round(15 * s) + "px sans-serif";
  ctx.fillText(game.changeover ? "CHANGEOVER…" : game.commodity.name + " · PLU " + game.commodity.plu, W / 2, 14 + 15 * s);
  ctx.fillStyle = "#9aa3b5";
  ctx.font = Math.round(11 * s) + "px sans-serif";
  ctx.fillText("FRUIT " + Math.min(game.levelCount, STAGE_SIZE) + "/" + STAGE_SIZE, W / 2, 18 + 15 * s + 15 * s);

  // Big line speed, top right under the pause button
  ctx.textAlign = "right";
  ctx.fillStyle = "#ffd166";
  ctx.font = "bold " + Math.round(30 * s) + "px sans-serif";
  ctx.fillText((game.beltSpeed / CUP_PITCH).toFixed(2), W - 14, 54 + 30 * s);
  ctx.fillStyle = "#9aa3b5";
  ctx.font = "bold " + Math.round(11 * s) + "px sans-serif";
  ctx.fillText("CUPS/SEC", W - 14, 58 + 30 * s + 12 * s);

  for (let i = 0; i < 3; i++) {
    const x = 28 + i * 34;
    const y = 30 + 62 * s + 12;
    ctx.fillStyle = i < game.lives ? "#fffbe8" : "rgba(255,255,255,0.12)";
    ctx.strokeStyle = i < game.lives ? "#ccb" : "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y, 13, 8, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (i < game.lives) {
      ctx.fillStyle = "#333";
      ctx.font = "bold 7px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PLU", x, y + 2.5);
    }
  }

  if (game.state === "playing" || game.state === "paused") {
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.roundRect(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.w, PAUSE_BTN.h, 8);
    ctx.fill();
    ctx.fillStyle = "#cdd3de";
    if (game.state === "playing") {
      ctx.fillRect(PAUSE_BTN.x + 12, PAUSE_BTN.y + 11, 5, 18);
      ctx.fillRect(PAUSE_BTN.x + 23, PAUSE_BTN.y + 11, 5, 18);
    } else {
      ctx.beginPath();
      ctx.moveTo(PAUSE_BTN.x + 13, PAUSE_BTN.y + 10);
      ctx.lineTo(PAUSE_BTN.x + 31, PAUSE_BTN.y + 20);
      ctx.lineTo(PAUSE_BTN.x + 13, PAUSE_BTN.y + 30);
      ctx.fill();
    }
  }
}

function drawTextsAndParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const t of game.texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 2));
    ctx.fillStyle = t.color;
    ctx.font = "bold " + Math.round(t.size * uiBoost) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function blink() {
  return Math.floor(game.time * 2) % 2 === 0;
}

function drawOverlay() {
  if (game.state === "playing") return;
  ctx.fillStyle = "rgba(10,13,20,0.8)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  const s = uiBoost;

  if (game.state === "menu") {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold " + Math.round(Math.min(40 * s, 46)) + "px sans-serif";
    ctx.fillText("FRUIT", W / 2, 200);
    ctx.fillText("LABELING HERO", W / 2, 200 + 46 * s);
    ctx.fillStyle = "#fff";
    ctx.font = Math.round(18 * s) + "px sans-serif";
    ctx.fillText("Fruit rides carrier cups up 4 lanes,", W / 2, 350);
    ctx.fillText("each lane with its own labeler.", W / 2, 350 + 28 * s);
    ctx.fillText("TAP A LANE to stamp the fruit", W / 2, 350 + 64 * s);
    ctx.fillText("crossing the bridge. Use both thumbs!", W / 2, 350 + 92 * s);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(14 * s) + "px sans-serif";
    ctx.fillText("One commodity at a time — every " + STAGE_SIZE + " fruits", W / 2, 530);
    ctx.fillText("the line changes over. It only gets faster.", W / 2, 530 + 22 * s);
    ctx.fillStyle = "#ffd166";
    ctx.fillText(CRIT_STREAK + " dead-center tags in a row = CRITICAL STRIKE:", W / 2, 530 + 52 * s);
    ctx.fillText("double points and 1 fruit off the stage.", W / 2, 530 + 74 * s);
    ctx.fillStyle = "#9aa3b5";
    ctx.fillText("Miss 3 fruits and the shift is over.", W / 2, 530 + 104 * s);
    ctx.fillStyle = "#7CFC9A";
    ctx.font = "bold " + Math.round(20 * s) + "px sans-serif";
    ctx.fillText(blink() ? "TAP TO CLOCK IN" : "", W / 2, 740);
  } else if (game.state === "paused") {
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.round(34 * s) + "px sans-serif";
    ctx.fillText("LINE STOPPED", W / 2, H / 2 - 20);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(16 * s) + "px sans-serif";
    ctx.fillText("Tap ▶ to restart the conveyor", W / 2, H / 2 + 24);
  } else if (game.state === "gameover") {
    ctx.fillStyle = "#ff6b6b";
    ctx.font = "bold " + Math.round(38 * s) + "px sans-serif";
    ctx.fillText("SHIFT OVER", W / 2, 300);
    ctx.fillStyle = "#fff";
    ctx.font = Math.round(24 * s) + "px sans-serif";
    ctx.fillText("Score: " + game.score, W / 2, 300 + 60 * s);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(15 * s) + "px sans-serif";
    ctx.fillText("Fruit processed: " + game.processed + " · Critical strikes: " + game.critCount, W / 2, 300 + 92 * s);
    ctx.fillStyle = game.score >= game.best && game.score > 0 ? "#ffd166" : "#9aa3b5";
    ctx.font = Math.round(16 * s) + "px sans-serif";
    ctx.fillText(game.score >= game.best && game.score > 0 ? "NEW PLANT RECORD!" : "Plant record: " + game.best, W / 2, 300 + 124 * s);
    ctx.fillStyle = "#7CFC9A";
    ctx.font = "bold " + Math.round(18 * s) + "px sans-serif";
    ctx.fillText(blink() ? "TAP FOR NEXT SHIFT" : "", W / 2, 620);
  }
}

function draw() {
  ctx.save();
  if (game.shake > 0) {
    ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  }
  drawBelts();
  drawCups();
  for (const fr of game.fruits) drawFruitTop(fr);
  drawLabelers();
  drawTextsAndParticles();
  drawCritFX();
  drawVignette();
  drawHUD();
  drawSlam();
  ctx.restore();
  drawOverlay();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  updateUiBoost();
  // the name/leaderboard buttons stay out of the way during a shift
  document.body.classList.toggle("inplay", game.state === "playing" || game.state === "paused");
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Input (multi-touch: every pointer fires independently) ----------
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height),
  };
}

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (overlaysOpen()) return;
  const p = canvasPos(e);

  if (game.state === "menu" || game.state === "gameover") { startGame(); return; }

  if (p.x >= PAUSE_BTN.x && p.x <= PAUSE_BTN.x + PAUSE_BTN.w &&
      p.y >= PAUSE_BTN.y && p.y <= PAUSE_BTN.y + PAUSE_BTN.h) {
    game.state = game.state === "playing" ? "paused" : "playing";
    return;
  }
  if (game.state === "paused") { game.state = "playing"; return; }

  tapLane(Math.max(0, Math.min(LANES - 1, Math.floor(p.x / LANE_W))));
});

window.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (document.activeElement === nameInput || overlaysOpen()) return;
  const lane = ["1", "2", "3", "4"].indexOf(e.key);
  if (lane >= 0) {
    e.preventDefault();
    if (game.state === "menu" || game.state === "gameover") startGame();
    else tapLane(lane);
    return;
  }
  if (e.key === "p" || e.key === "P") {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }
  if ((e.key === "Enter" || e.key === " ") && (game.state === "menu" || game.state === "gameover")) {
    e.preventDefault();
    startGame();
  }
});
</script>
