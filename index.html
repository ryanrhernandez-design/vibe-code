<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1e28">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fruit Labeling Hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #14181f;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #eee;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    height: 100%;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px;
    padding-bottom: max(6px, env(safe-area-inset-bottom));
  }
  #game {
    background: #222836;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    width: min(100%, calc((100dvh - 12px) * 9 / 16));
    aspect-ratio: 9 / 16;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="960"></canvas>
</div>

<script>
"use strict";

// ---------- Setup ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;

const LANES = 4;
const LANE_W = W / LANES;
const laneX = i => LANE_W * (i + 0.5);

const LABELER_Y = 300;        // fruit crossing this line gets labeled
const STAMP_WINDOW = 16;      // extra reach beyond fruit radius
const CARRIAGE_SPEED = 1700;  // px/s lateral travel of the labeler head

const COMMODITIES = [
  { id: "avocado", name: "AVOCADOS", plu: "4046" },
  { id: "apple",   name: "APPLES",   plu: "4131" },
  { id: "citrus",  name: "ORANGES",  plu: "4012" },
  { id: "stone",   name: "PEACHES",  plu: "4044" },
];

// Text boost so HUD/messages stay readable when the canvas is shrunk on phones
let uiBoost = 1;
function updateUiBoost() {
  const cw = canvas.clientWidth || W;
  uiBoost = Math.min(1.3, Math.max(1, 460 / cw));
}

// ---------- Audio ----------
let audioCtx = null;
function beep(freq, dur, type = "sine", vol = 0.15, when = 0) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime + when;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audioCtx.destination);
  o.start(t);
  o.stop(t + dur);
}
const sfx = {
  stamp:    () => { beep(120, 0.07, "square", 0.18); },
  correct:  () => { beep(660, 0.08, "sine", 0.12); beep(880, 0.12, "sine", 0.12, 0.07); },
  perfect:  () => { beep(660, 0.07, "sine", 0.12); beep(880, 0.07, "sine", 0.12, 0.06); beep(1320, 0.14, "sine", 0.12, 0.12); },
  whiff:    () => { beep(300, 0.06, "triangle", 0.08); },
  miss:     () => { beep(220, 0.15, "square", 0.12); beep(150, 0.25, "square", 0.12, 0.12); },
  speedup:  () => { beep(523, 0.1, "sine", 0.12); beep(784, 0.16, "sine", 0.12, 0.09); },
  changeover:() => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, "sine", 0.12, i * 0.09)); },
  gameover: () => { [392, 330, 262, 196].forEach((f, i) => beep(f, 0.25, "triangle", 0.15, i * 0.2)); },
};

// ---------- Game state ----------
const game = {
  state: "menu",              // menu | playing | paused | gameover
  fruits: [],
  texts: [],
  particles: [],
  score: 0,
  best: Number(localStorage.getItem("flh-best") || 0),
  lives: 3,
  combo: 0,
  beltSpeed: 150,
  speedSteps: 0,
  processed: 0,               // fruits past the labeler (labeled or missed)
  levelCount: 0,              // fruits processed in current commodity run
  commodity: COMMODITIES[0],
  commodityQueue: [],
  shift: 1,                   // how many commodity runs completed + 1
  changeover: false,          // draining the belt before the next commodity
  spawnTimer: 1,
  pattern: [],                // randomized lane order for upcoming spawns
  carriageX: laneX(1),
  targetLane: 1,
  pending: false,             // a stamp is queued for carriage arrival
  stampAnim: 0,
  fingerRot: 0,
  shake: 0,
  time: 0,
};

function pickCommodity() {
  if (game.commodityQueue.length === 0) {
    const q = COMMODITIES.slice();
    for (let i = q.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [q[i], q[j]] = [q[j], q[i]];
    }
    // Avoid repeating the commodity we just ran
    if (q[0].id === game.commodity.id && q.length > 1) [q[0], q[1]] = [q[1], q[0]];
    game.commodityQueue = q;
  }
  return game.commodityQueue.shift();
}

function reset() {
  game.fruits = [];
  game.texts = [];
  game.particles = [];
  game.score = 0;
  game.lives = 3;
  game.combo = 0;
  game.beltSpeed = 150;
  game.speedSteps = 0;
  game.processed = 0;
  game.levelCount = 0;
  game.commodityQueue = [];
  game.commodity = pickCommodity();
  game.shift = 1;
  game.changeover = false;
  game.spawnTimer = 1.2;
  game.pattern = [];
  game.carriageX = laneX(1);
  game.targetLane = 1;
  game.pending = false;
  game.stampAnim = 0;
  game.shake = 0;
}

// ---------- Spawning: randomized lane patterns ----------
function nextPatternLane() {
  if (game.pattern.length === 0) {
    const p = [0, 1, 2, 3];
    for (let i = p.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [p[i], p[j]] = [p[j], p[i]];
    }
    game.pattern = p;
  }
  return game.pattern.shift();
}

function laneIsClear(lane) {
  for (const fr of game.fruits) {
    if (fr.lane === lane && fr.y > H - 150) return false;
  }
  return true;
}

function spawnFruit(lane) {
  game.fruits.push({
    lane,
    x: laneX(lane),
    y: H + 45,
    r: 27 + Math.random() * 5,
    type: game.commodity.id,
    plu: game.commodity.plu,
    labeled: false,
    missed: false,
    rot: Math.random() * Math.PI * 2,
    bobSeed: Math.random() * 10,
  });
}

function trySpawn() {
  let lane = nextPatternLane();
  if (!laneIsClear(lane)) {
    const open = [0, 1, 2, 3].filter(laneIsClear);
    if (open.length === 0) return;
    lane = open[Math.floor(Math.random() * open.length)];
  }
  spawnFruit(lane);
  // Occasional simultaneous second fruit in another lane, more often later on
  const doubleChance = Math.min(0.35, 0.04 + game.speedSteps * 0.05);
  if (Math.random() < doubleChance) {
    const open = [0, 1, 2, 3].filter(l => l !== lane && laneIsClear(l));
    if (open.length) spawnFruit(open[Math.floor(Math.random() * open.length)]);
  }
}

// ---------- Feedback helpers ----------
function addText(x, y, str, color, size = 20) {
  game.texts.push({ x, y, str, color, size, life: 1 });
}

function addBurst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * 140;
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60, life: 0.6, color });
  }
}

function loseLife(reason, x, y) {
  game.lives--;
  game.combo = 0;
  game.shake = 8;
  addText(x, y, reason, "#ff6b6b", 20);
  if (game.lives <= 0) {
    game.state = "gameover";
    if (game.score > game.best) {
      game.best = game.score;
      localStorage.setItem("flh-best", String(game.best));
    }
    sfx.gameover();
  }
}

// ---------- Throughput milestones ----------
function fruitProcessed() {
  game.processed++;
  game.levelCount++;
  if (game.processed % 15 === 0) {
    game.speedSteps++;
    game.beltSpeed *= 1.07;
    addText(W / 2, LABELER_Y + 160, "LINE SPEED UP!", "#ffd166", 24);
    sfx.speedup();
  }
  if (game.levelCount >= 30 && !game.changeover) {
    game.changeover = true; // stop spawning, drain the belt, then switch commodity
  }
}

function completeChangeover() {
  game.changeover = false;
  game.levelCount = 0;
  game.shift++;
  game.commodity = pickCommodity();
  addText(W / 2, LABELER_Y + 130, "CHANGEOVER!", "#ffd166", 28);
  addText(W / 2, LABELER_Y + 170, "NOW RUNNING: " + game.commodity.name + " · PLU " + game.commodity.plu, "#7CFC9A", 17);
  sfx.changeover();
  game.spawnTimer = 1.0;
}

// ---------- Input: send the labeler to a lane ----------
function tapLane(lane) {
  if (game.state !== "playing") return;
  game.targetLane = lane;
  game.pending = true;
  // Already on station: stamp immediately
  if (Math.abs(game.carriageX - laneX(lane)) < 3) fireStamp();
}

function fireStamp() {
  game.pending = false;
  game.stampAnim = 1;
  sfx.stamp();
  const lane = game.targetLane;

  let target = null, bestDist = Infinity;
  for (const fr of game.fruits) {
    if (fr.lane !== lane || fr.labeled || fr.missed) continue;
    const d = Math.abs(fr.y - LABELER_Y);
    if (d <= fr.r + STAMP_WINDOW && d < bestDist) { bestDist = d; target = fr; }
  }

  if (!target) {
    addText(laneX(lane), LABELER_Y - 40, "NO FRUIT", "#9aa3b5", 14);
    sfx.whiff();
    return;
  }

  target.labeled = true;
  const accuracy = 1 - bestDist / (target.r + STAMP_WINDOW);
  game.combo++;
  const mult = 1 + Math.min(game.combo - 1, 10) * 0.1;
  let pts = Math.round(100 * mult);
  if (accuracy > 0.75) {
    pts += 50;
    addText(target.x, LABELER_Y - 50, "DEAD CENTER +" + pts, "#7CFC9A", 18);
    sfx.perfect();
  } else {
    addText(target.x, LABELER_Y - 50, "+" + pts, "#7CFC9A", 17);
    sfx.correct();
  }
  if (game.combo >= 3) addText(target.x, LABELER_Y - 78, "x" + game.combo + " combo", "#ffd166", 13);
  game.score += pts;
  addBurst(target.x, LABELER_Y, "#7CFC9A", 8);
  fruitProcessed();
}

function startGame() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  reset();
  game.state = "playing";
}

// ---------- Update ----------
function update(dt) {
  game.time += dt;
  game.fingerRot += dt * 2.2;
  if (game.state !== "playing") return;

  // Spawning (paused during changeover drain)
  if (!game.changeover) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      trySpawn();
      const gapPx = 200;                       // average spacing along the belt
      const base = gapPx / game.beltSpeed;
      game.spawnTimer = base * (0.7 + Math.random() * 0.8);
    }
  } else if (game.fruits.length === 0) {
    completeChangeover();
  }

  // Carriage travel; stamp on arrival
  const tx = laneX(game.targetLane);
  if (Math.abs(game.carriageX - tx) > 1) {
    const dir = Math.sign(tx - game.carriageX);
    game.carriageX += dir * CARRIAGE_SPEED * dt;
    if (Math.sign(tx - game.carriageX) !== dir) game.carriageX = tx;
  }
  if (game.pending && Math.abs(game.carriageX - tx) <= 1) fireStamp();

  // Fruit movement (bottom to top)
  for (const fr of game.fruits) {
    fr.y -= game.beltSpeed * dt;
    fr.rot += game.beltSpeed * dt / fr.r * 0.1;
    // Passed the labeler unlabeled = missed
    if (!fr.labeled && !fr.missed && fr.y < LABELER_Y - fr.r - STAMP_WINDOW) {
      fr.missed = true;
      sfx.miss();
      loseLife("MISSED!", fr.x, LABELER_Y - 60);
      fruitProcessed();
    }
  }
  for (let i = game.fruits.length - 1; i >= 0; i--) {
    if (game.fruits[i].y < -50) game.fruits.splice(i, 1);
  }

  // Animations
  game.stampAnim = Math.max(0, game.stampAnim - dt * 5);
  game.shake = Math.max(0, game.shake - dt * 30);
  for (let i = game.texts.length - 1; i >= 0; i--) {
    const t = game.texts[i];
    t.life -= dt * 0.6;
    t.y -= dt * 26;
    if (t.life <= 0) game.texts.splice(i, 1);
  }
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 400 * dt;
    if (p.life <= 0) game.particles.splice(i, 1);
  }
}

// ---------- Drawing ----------
function drawBelts() {
  // Belt surface
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#262c38");
  g.addColorStop(1, "#202531");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Moving cross-seams (belt runs upward)
  const offset = (game.time * (game.state === "playing" ? game.beltSpeed : 60)) % 64;
  ctx.strokeStyle = "rgba(255,255,255,0.05)";
  ctx.lineWidth = 2;
  for (let y = -64 + offset; y < H + 64; y += 64) {
    for (let l = 0; l < LANES; l++) {
      ctx.beginPath();
      ctx.moveTo(l * LANE_W + 8, y);
      ctx.lineTo((l + 1) * LANE_W - 8, y + 6);
      ctx.stroke();
    }
  }

  // Lane rails
  for (let l = 0; l <= LANES; l++) {
    const x = l * LANE_W;
    ctx.fillStyle = "#39404f";
    ctx.fillRect(x - 4, 0, 8, H);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(x + 2, 0, 2, H);
  }
}

function drawFruitTop(fr) {
  const wob = Math.sin(game.time * 6 + fr.bobSeed) * 1.5;
  ctx.save();
  ctx.translate(fr.x + wob, fr.y);

  // Drop shadow on the belt
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath();
  ctx.ellipse(3, 4, fr.r * 0.95, fr.r * 0.9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(Math.sin(fr.rot) * 0.1);

  if (fr.type === "avocado") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#5d7d3a");
    g.addColorStop(1, "#2f4520");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, fr.r * 0.78, fr.r, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.18)";
    for (let i = 0; i < 14; i++) {
      const a = i * 2.39996 + fr.bobSeed;
      const rr = (i % 5 + 2) / 7 * fr.r * 0.65;
      ctx.fillRect(Math.cos(a) * rr, Math.sin(a) * rr, 2, 2);
    }
  } else if (fr.type === "apple") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#f25c5c");
    g.addColorStop(1, "#a31f2b");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    // Stem well seen from above
    ctx.fillStyle = "rgba(90,30,30,0.5)";
    ctx.beginPath();
    ctx.arc(0, 0, fr.r * 0.18, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#6b4423";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(5, -7);
    ctx.stroke();
  } else if (fr.type === "citrus") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#ffba49");
    g.addColorStop(1, "#e07b00");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "rgba(160,80,0,0.35)";
    for (let i = 0; i < 12; i++) {
      const a = i * 2.39996 + 1;
      const rr = (i % 4 + 2) / 6 * fr.r * 0.75;
      ctx.beginPath();
      ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 1.4, 0, Math.PI * 2);
      ctx.fill();
    }
    // Calyx star
    ctx.fillStyle = "#4f8f3a";
    ctx.beginPath();
    ctx.arc(0, 0, fr.r * 0.12, 0, Math.PI * 2);
    ctx.fill();
  } else if (fr.type === "stone") {
    const g = ctx.createRadialGradient(-fr.r * 0.3, -fr.r * 0.3, 4, 0, 0, fr.r * 1.2);
    g.addColorStop(0, "#ffc09f");
    g.addColorStop(1, "#e8636f");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, fr.r, 0, Math.PI * 2);
    ctx.fill();
    // Suture crease across the top
    ctx.strokeStyle = "rgba(160,50,60,0.5)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(fr.r * 0.3, fr.r * 0.5, fr.r * 0.15, fr.r * 0.95);
    ctx.stroke();
  }

  // Highlight
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.beginPath();
  ctx.ellipse(-fr.r * 0.35, -fr.r * 0.4, fr.r * 0.22, fr.r * 0.12, -0.6, 0, Math.PI * 2);
  ctx.fill();

  // PLU sticker (top view: right where the finger tapped it)
  if (fr.labeled) {
    ctx.save();
    ctx.rotate(-0.15);
    ctx.fillStyle = "#fffbe8";
    ctx.strokeStyle = "#ccb";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#333";
    ctx.font = "bold 9px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(fr.plu, 0, 3);
    ctx.restore();
  }
  // Missed fruit gets flagged
  if (fr.missed) {
    ctx.strokeStyle = "#ff6b6b";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
    ctx.moveTo(10, -10); ctx.lineTo(-10, 10);
    ctx.stroke();
  }
  ctx.restore();
}

function drawLabeler() {
  // Stamp pulse under the bridge, on the fruit
  if (game.stampAnim > 0) {
    const a = game.stampAnim;
    ctx.strokeStyle = "rgba(255,209,102," + (a * 0.9) + ")";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(game.carriageX, LABELER_Y, 14 + (1 - a) * 26, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Gantry bridge across all lanes
  ctx.fillStyle = "rgba(45,51,64,0.88)";
  ctx.fillRect(0, LABELER_Y - 14, W, 28);
  ctx.strokeStyle = "#4a5366";
  ctx.lineWidth = 2;
  ctx.strokeRect(0, LABELER_Y - 14, W, 28);

  // Stamp window guides per lane
  ctx.strokeStyle = "rgba(255,209,102,0.35)";
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 5]);
  for (let l = 0; l < LANES; l++) {
    const x = laneX(l);
    ctx.beginPath();
    ctx.moveTo(x - 32, LABELER_Y + 44);
    ctx.lineTo(x + 32, LABELER_Y + 44);
    ctx.moveTo(x - 32, LABELER_Y - 44);
    ctx.lineTo(x + 32, LABELER_Y - 44);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // Carriage with rotary finger head
  const cx = game.carriageX;
  ctx.fillStyle = "#454c5c";
  ctx.fillRect(cx - 30, LABELER_Y - 22, 60, 44);
  ctx.strokeStyle = "#5b6478";
  ctx.strokeRect(cx - 30, LABELER_Y - 22, 60, 44);

  // Bellows fingers rotating around the head
  const headR = 16;
  const squash = 1 - game.stampAnim * 0.35; // head dips when stamping
  ctx.save();
  ctx.translate(cx, LABELER_Y);
  ctx.scale(squash, squash);
  ctx.fillStyle = "#39404f";
  ctx.beginPath();
  ctx.arc(0, 0, headR, 0, Math.PI * 2);
  ctx.fill();
  for (let i = 0; i < 4; i++) {
    const a = game.fingerRot + i * Math.PI / 2;
    const fx = Math.cos(a) * headR, fy = Math.sin(a) * headR;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(fx, fy, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "#fffbe8";
  ctx.beginPath();
  ctx.ellipse(0, 0, 9, 6, -0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // Bridge label
  ctx.fillStyle = "#9aa3b5";
  ctx.font = "bold 10px sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("LABELER MK-V", 8, LABELER_Y - 20);
}

const PAUSE_BTN = { x: W - 50, y: 10, w: 40, h: 40 };
function drawHUD() {
  const s = uiBoost;

  // Top bar backdrop
  const grad = ctx.createLinearGradient(0, 0, 0, 120);
  grad.addColorStop(0, "rgba(10,12,18,0.85)");
  grad.addColorStop(1, "rgba(10,12,18,0)");
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, 120);

  ctx.textAlign = "left";
  ctx.fillStyle = "#fff";
  ctx.font = "bold " + Math.round(22 * s) + "px sans-serif";
  ctx.fillText(String(game.score).padStart(6, "0"), 14, 12 + 22 * s);
  ctx.fillStyle = "#9aa3b5";
  ctx.font = Math.round(11 * s) + "px sans-serif";
  ctx.fillText("BEST " + game.best, 14, 12 + 22 * s + 16 * s);

  // Commodity + progress, centered
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd166";
  ctx.font = "bold " + Math.round(15 * s) + "px sans-serif";
  ctx.fillText(game.changeover ? "CHANGEOVER…" : game.commodity.name + " · PLU " + game.commodity.plu, W / 2, 14 + 15 * s);
  ctx.fillStyle = "#9aa3b5";
  ctx.font = Math.round(11 * s) + "px sans-serif";
  ctx.fillText("FRUIT " + Math.min(game.levelCount, 30) + "/30 · SPEED x" + (game.beltSpeed / 150).toFixed(2), W / 2, 18 + 15 * s + 15 * s);

  // Lives as PLU stickers under the score
  for (let i = 0; i < 3; i++) {
    const x = 28 + i * 34;
    const y = 30 + 38 * s + 12;
    ctx.fillStyle = i < game.lives ? "#fffbe8" : "rgba(255,255,255,0.12)";
    ctx.strokeStyle = i < game.lives ? "#ccb" : "rgba(255,255,255,0.15)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(x, y, 13, 8, -0.15, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    if (i < game.lives) {
      ctx.fillStyle = "#333";
      ctx.font = "bold 7px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("PLU", x, y + 2.5);
    }
  }

  if (game.combo >= 3) {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold " + Math.round(14 * s) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("COMBO x" + game.combo, W / 2, 70 + 14 * s);
  }

  // Pause button
  if (game.state === "playing" || game.state === "paused") {
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.roundRect(PAUSE_BTN.x, PAUSE_BTN.y, PAUSE_BTN.w, PAUSE_BTN.h, 8);
    ctx.fill();
    ctx.fillStyle = "#cdd3de";
    if (game.state === "playing") {
      ctx.fillRect(PAUSE_BTN.x + 12, PAUSE_BTN.y + 11, 5, 18);
      ctx.fillRect(PAUSE_BTN.x + 23, PAUSE_BTN.y + 11, 5, 18);
    } else {
      ctx.beginPath();
      ctx.moveTo(PAUSE_BTN.x + 13, PAUSE_BTN.y + 10);
      ctx.lineTo(PAUSE_BTN.x + 31, PAUSE_BTN.y + 20);
      ctx.lineTo(PAUSE_BTN.x + 13, PAUSE_BTN.y + 30);
      ctx.fill();
    }
  }
}

function drawTextsAndParticles() {
  for (const p of game.particles) {
    ctx.globalAlpha = Math.max(0, p.life / 0.6);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const t of game.texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 2));
    ctx.fillStyle = t.color;
    ctx.font = "bold " + Math.round(t.size * uiBoost) + "px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(t.str, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function blink() {
  return Math.floor(game.time * 2) % 2 === 0;
}

function drawOverlay() {
  if (game.state === "playing") return;
  ctx.fillStyle = "rgba(10,13,20,0.8)";
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  const s = uiBoost;

  if (game.state === "menu") {
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold " + Math.round(Math.min(40 * s, 46)) + "px sans-serif";
    ctx.fillText("FRUIT", W / 2, 220);
    ctx.fillText("LABELING HERO", W / 2, 220 + 46 * s);
    ctx.fillStyle = "#fff";
    ctx.font = Math.round(18 * s) + "px sans-serif";
    ctx.fillText("Fruit runs up 4 lanes.", W / 2, 380);
    ctx.fillText("TAP A LANE to send the labeler", W / 2, 380 + 28 * s);
    ctx.fillText("and tag fruit crossing the bridge.", W / 2, 380 + 56 * s);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(14 * s) + "px sans-serif";
    ctx.fillText("One commodity at a time — every 30 fruits", W / 2, 520);
    ctx.fillText("the line changes over. It only gets faster.", W / 2, 520 + 22 * s);
    ctx.fillText("Miss 3 and the shift is over.", W / 2, 520 + 44 * s);
    ctx.fillStyle = "#7CFC9A";
    ctx.font = "bold " + Math.round(20 * s) + "px sans-serif";
    ctx.fillText(blink() ? "TAP TO CLOCK IN" : "", W / 2, 680);
  } else if (game.state === "paused") {
    ctx.fillStyle = "#fff";
    ctx.font = "bold " + Math.round(34 * s) + "px sans-serif";
    ctx.fillText("LINE STOPPED", W / 2, H / 2 - 20);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(16 * s) + "px sans-serif";
    ctx.fillText("Tap ▶ to restart the conveyor", W / 2, H / 2 + 24);
  } else if (game.state === "gameover") {
    ctx.fillStyle = "#ff6b6b";
    ctx.font = "bold " + Math.round(38 * s) + "px sans-serif";
    ctx.fillText("SHIFT OVER", W / 2, 320);
    ctx.fillStyle = "#fff";
    ctx.font = Math.round(24 * s) + "px sans-serif";
    ctx.fillText("Score: " + game.score, W / 2, 320 + 60 * s);
    ctx.fillStyle = "#9aa3b5";
    ctx.font = Math.round(15 * s) + "px sans-serif";
    ctx.fillText("Fruit labeled this shift: " + game.processed, W / 2, 320 + 92 * s);
    ctx.fillStyle = game.score >= game.best && game.score > 0 ? "#ffd166" : "#9aa3b5";
    ctx.font = Math.round(16 * s) + "px sans-serif";
    ctx.fillText(game.score >= game.best && game.score > 0 ? "NEW PLANT RECORD!" : "Plant record: " + game.best, W / 2, 320 + 124 * s);
    ctx.fillStyle = "#7CFC9A";
    ctx.font = "bold " + Math.round(18 * s) + "px sans-serif";
    ctx.fillText(blink() ? "TAP FOR NEXT SHIFT" : "", W / 2, 620);
  }
}

function draw() {
  ctx.save();
  if (game.shake > 0) {
    ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  }
  drawBelts();
  for (const fr of game.fruits) drawFruitTop(fr);
  drawLabeler();
  drawTextsAndParticles();
  drawHUD();
  ctx.restore();
  drawOverlay();
}

// ---------- Loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  updateUiBoost();
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Input ----------
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (W / rect.width),
    y: (e.clientY - rect.top) * (H / rect.height),
  };
}

canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  const p = canvasPos(e);

  if (game.state === "menu" || game.state === "gameover") { startGame(); return; }

  // Pause button
  if (p.x >= PAUSE_BTN.x && p.x <= PAUSE_BTN.x + PAUSE_BTN.w &&
      p.y >= PAUSE_BTN.y && p.y <= PAUSE_BTN.y + PAUSE_BTN.h) {
    game.state = game.state === "playing" ? "paused" : "playing";
    return;
  }
  if (game.state === "paused") { game.state = "playing"; return; }

  tapLane(Math.max(0, Math.min(LANES - 1, Math.floor(p.x / LANE_W))));
});

window.addEventListener("keydown", e => {
  if (e.repeat) return;
  const lane = ["1", "2", "3", "4"].indexOf(e.key);
  if (lane >= 0) {
    e.preventDefault();
    if (game.state === "menu" || game.state === "gameover") startGame();
    else tapLane(lane);
    return;
  }
  if (e.key === "p" || e.key === "P") {
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }
  if ((e.key === "Enter" || e.key === " ") && (game.state === "menu" || game.state === "gameover")) {
    e.preventDefault();
    startGame();
  }
});
</script>
</body>
